# markdown
markdown: redcarpet
redcarpet:
  extensions: ["superscript","tables","with_toc_data","strikethrough"]
highlighter: pygments

exclude:
- ".ruby-version"
- ".jekyll-metadata"
- ".gitignore"
- ".travis.yml"
- todo.txt
- resources
- Gemfile
- Gemfile.lock
- Makefile
- vendor
- README.md
- CONTRIBUTING.md
- LICENSE.md

# Site metadata
name: "Card Companion"
description: "Tools and guides to maximize the value of every loyalty point in your wallet."
baseurl: ""
# Uncomment the following line for localhost development at http://127.0.0.1:4000/datacenters/
#baseurl: /datacenters/

# GitHub information
org_name: whitehouse
repo_name: datacenters
branch: gh-pages

# Navigation
# List links that should appear in the site sidebar here
navigation:
- text: Home
  url: /
- text: Strategy Playbook
  url: /strategy/
- text: Point Valuation Benchmarks
  url: /valuations/
- text: Tracking Routines
  url: /tracking/
- text: FAQ & Resources
  url: /faq/

# sass
sass:
  sass_dir: _sass
